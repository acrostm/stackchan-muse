name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 tools/check_repository.py
      - run: git show --format= --check HEAD -- . ":!firmware/**" ":!LICENSE"
      - name: Run project tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -v 2>&1 | tee project-tests.log
          test_result=${PIPESTATUS[0]}
          if [ "$test_result" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error title=Project test failed::$line"
            done < <(grep -E '^(FAIL|ERROR):' project-tests.log)
          fi
          exit "$test_result"

  firmware:
    name: Firmware (${{ matrix.board }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container: espressif/idf:v6.0.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: stackchan
            profile: m5stack-stackchan
            target: esp32s3
            extra_config: ""
          - board: stackchan-camera
            profile: m5stack-stackchan
            target: esp32s3
            extra_config: CONFIG_MUSE_STACKCHAN_CAMERA=y
          - board: cores3
            profile: m5stack-cores3
            target: esp32s3
            extra_config: ""
          - board: waveshare-c6-18
            profile: waveshare-c6-18
            target: esp32c6
            extra_config: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build account-free firmware and check partition size
        shell: bash
        working-directory: firmware/esp32
        env:
          BOARD: ${{ matrix.board }}
          EXTRA_CONFIG: ${{ matrix.extra_config }}
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          cp ../../docs/firmware-dependencies.lock.yml dependencies.lock
          defaults="sdkconfig.defaults;devices/sdkconfig.muse;devices/sdkconfig.muse-${{ matrix.profile }}"
          mkdir -p build-ci
          if [ -n "$EXTRA_CONFIG" ]; then
            printf '%s\n' "$EXTRA_CONFIG" > build-ci/extra.defaults
            defaults="$defaults;build-ci/extra.defaults"
          fi
          idf.py -B "$PWD/build-ci" -DIDF_TARGET="${{ matrix.target }}" \
            -DSDKCONFIG="$PWD/build-ci/sdkconfig" \
            -DSDKCONFIG_DEFAULTS="$defaults" build
      - name: Verify reviewed dependency versions
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          python tools/check_dependency_lock.py firmware/esp32/dependencies.lock --target "$TARGET"
      - name: Package allowlisted artifacts
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          python tools/package_firmware.py --build firmware/esp32/build-ci --board "$BOARD" --output artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: firmware-${{ matrix.board }}-no-token
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  upstream-tests:
    name: Upstream host tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: espressif/idf:v6.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install real host crypto dependencies
        shell: bash
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends libmbedtls-dev pkg-config
          . "$IDF_PATH/export.sh" > /dev/null
          python -c 'import cryptography; print("ESP-IDF crypto dependencies available")'
      - name: Configure managed components
        shell: bash
        working-directory: firmware/esp32
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -B "$PWD/build-host-tests" -DSDKCONFIG="$PWD/build-host-tests/sdkconfig" reconfigure
      - name: Test with no skipped coverage
        shell: bash
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          python tools/run_upstream_tests.py

  simulator:
    name: UI simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build libsdl2-dev
      - run: cmake -S firmware/esp32/simulator -B build-simulator -G Ninja -DMUSE_SIM_SANITIZERS=ON -DMUSE_SIM_WARNINGS_AS_ERRORS=ON
      - run: cmake --build build-simulator --parallel 2
      - run: ctest --test-dir build-simulator --output-on-failure

  quality-gate:
    name: Quality gate
    if: ${{ always() }}
    needs: [repository, firmware, upstream-tests, simulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PYCODE
